name: CI / Pre-deploy Validation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  # 1. 型チェック
  # ─────────────────────────────────────────────
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run type-check

  # ─────────────────────────────────────────────
  # 2. Lint
  # ─────────────────────────────────────────────
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  # ─────────────────────────────────────────────
  # 3. ユニットテスト
  # ─────────────────────────────────────────────
  unit-tests:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test -- --run --reporter=verbose
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/

  # ─────────────────────────────────────────────
  # 4. ビルド検証（Vercel デプロイ前チェック）
  # ─────────────────────────────────────────────
  build:
    name: Next.js Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next/
          retention-days: 1

  # ─────────────────────────────────────────────
  # 5. 国税庁データ鮮度チェック
  # ─────────────────────────────────────────────
  nta-data-check:
    name: NTA Data Freshness Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/check-nta-data.ts
        continue-on-error: true  # 警告はデプロイをブロックしない

  # ─────────────────────────────────────────────
  # 6. Pre-mortem サマリー（全ジョブ完了後）
  # ─────────────────────────────────────────────
  pre-mortem-summary:
    name: Pre-mortem Summary
    runs-on: ubuntu-latest
    needs: [typecheck, lint, unit-tests, build]
    if: always()
    steps:
      - name: Check all gates
        run: |
          echo "=== Pre-deploy Validation Summary ==="
          echo "TypeCheck: ${{ needs.typecheck.result }}"
          echo "Lint:      ${{ needs.lint.result }}"
          echo "Tests:     ${{ needs.unit-tests.result }}"
          echo "Build:     ${{ needs.build.result }}"

          if [[ "${{ needs.typecheck.result }}" != "success" ]] ||
             [[ "${{ needs.lint.result }}" != "success" ]] ||
             [[ "${{ needs.unit-tests.result }}" != "success" ]] ||
             [[ "${{ needs.build.result }}" != "success" ]]; then
            echo ""
            echo "❌ One or more gates failed. Deployment blocked."
            exit 1
          fi

          echo ""
          echo "✅ All gates passed. Ready for deployment."
