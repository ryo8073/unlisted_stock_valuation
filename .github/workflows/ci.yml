name: CI / Pre-deploy Validation

on:
  push:
    branches: [main]
    paths:
      # これ以外のファイル（README、メモ等）のコミットはCIをスキップ
      - 'app/**'
      - 'lib/**'
      - 'components/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'tsconfig.json'
      - '.eslintrc.json'
      - 'next.config.js'
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  # 1. 型チェック + Lint（統合して消費分数を削減）
  # ─────────────────────────────────────────────
  typecheck-and-lint:
    name: TypeCheck & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm          # node_modules をキャッシュして npm ci を高速化
      - run: npm ci --prefer-offline
      - run: npm run type-check
      - run: npm run lint

  # ─────────────────────────────────────────────
  # 2. ユニットテスト
  # ─────────────────────────────────────────────
  unit-tests:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --prefer-offline
      - run: npm run test:run

  # ─────────────────────────────────────────────
  # 3. ビルド検証（typecheck-and-lint 通過後のみ実行）
  # ─────────────────────────────────────────────
  build:
    name: Next.js Build
    runs-on: ubuntu-latest
    needs: [typecheck-and-lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --prefer-offline
      - run: npm run build

  # ─────────────────────────────────────────────
  # 4. 国税庁データ鮮度チェック（警告のみ・デプロイはブロックしない）
  # ─────────────────────────────────────────────
  nta-data-check:
    name: NTA Data Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --prefer-offline
      - run: npm run check-nta
        continue-on-error: true

  # ─────────────────────────────────────────────
  # 5. Pre-mortem サマリー
  # ─────────────────────────────────────────────
  pre-mortem-summary:
    name: Pre-mortem Summary
    runs-on: ubuntu-latest
    needs: [typecheck-and-lint, unit-tests, build]
    if: always()
    steps:
      - name: Check all gates
        run: |
          echo "=== Pre-deploy Validation Summary ==="
          echo "TypeCheck+Lint: ${{ needs.typecheck-and-lint.result }}"
          echo "Tests:          ${{ needs.unit-tests.result }}"
          echo "Build:          ${{ needs.build.result }}"

          if [[ "${{ needs.typecheck-and-lint.result }}" != "success" ]] ||
             [[ "${{ needs.unit-tests.result }}" != "success" ]] ||
             [[ "${{ needs.build.result }}" != "success" ]]; then
            echo ""
            echo "❌ One or more gates failed. Deployment blocked."
            exit 1
          fi

          echo "✅ All gates passed. Ready for deployment."
